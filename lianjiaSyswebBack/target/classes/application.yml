server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:h2:mem:lianjia_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# JWT配置
jwt:
  secret: lianjia-secret-key-2024-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    com.lianjia: DEBUG
    org.hibernate.SQL: DEBUG
